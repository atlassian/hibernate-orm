// NOTE: gradle-jdocbook 1.2.2 is incompatible with Gradle 4.x (uses removed org.gradle.listener.ActionBroadcast API).
// The jdocbook buildscript and plugin are disabled when building with Gradle 4.x.
// To regenerate documentation, use Gradle 1.x/2.x with the original documentation.gradle.

apply plugin: "java"

// Documentation build tasks are no-ops under Gradle 4.x.
// All jdocbook-specific configuration has been disabled.
task buildDocs {
    description = "Documentation build (disabled under Gradle 4.x - requires gradle-jdocbook)"
    doLast {
        logger.lifecycle( "Documentation build skipped: gradle-jdocbook plugin is not compatible with Gradle 4.x" )
    }
}
