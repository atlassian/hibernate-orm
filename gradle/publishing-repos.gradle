apply plugin: 'maven-publish'
apply plugin: 'uploadAuth'

publishing {
    publications {
        publishedArtifacts( MavenPublication )
    }

    repositories {
        maven {
            name 'atlassian-releases-repository'
            url "https://packages.atlassian.com/maven/3rdparty"
        }
    }
}
